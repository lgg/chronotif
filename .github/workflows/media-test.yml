name: Media test APK

on:
  push:
    branches:
      - feat/media-dismiss-upstream
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test, lint and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Save CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronotif-media-test-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish a test prerelease in this fork
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="media-test-${RUN_NUMBER}"
          apk="chronotif-media-test-${RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$tag" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Chronotif Media Test ${RUN_NUMBER}" \
            --notes "Test build from feat/media-dismiss-upstream: cache Play/Pause action hints per notification, retain live playback checks and revalidate before dismissal. Debug package app.chronotif.debug installs alongside stable/nightly." \
            --prerelease --latest=false
