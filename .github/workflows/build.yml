name: build

on:
  push:
    branches: [main]
    tags: ["v*", "nightly-*"]
  pull_request:
  schedule:
    - cron: "0 18 * * *" # 01:00 Asia/Jakarta (upstream default)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Never execute PR code from another repository on a personal self-hosted PC.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, chronotif-ci]
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      # Existing installations on the Windows machine; NEVER auto-install SDK/JDK.
      ANDROID_HOME: 'D:\Android\Sdk'
      JAVA_HOME: 'C:\Program Files\Eclipse Adoptium\jdk-17.0.20.101-hotspot'
      # Keep Gradle's project-specific cache off the crowded C: drive.
      GRADLE_USER_HOME: 'D:\Android\gradle-chronotif'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify locally installed build tools (no installs)
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            "$env:JAVA_HOME\bin\javac.exe",
            "$env:ANDROID_HOME\platforms\android-36\android.jar",
            "$env:ANDROID_HOME\build-tools\36.0.0\aapt2.exe",
            ".\gradlew.bat"
          )
          foreach ($path in $checks) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing local tool: $path. Install it manually before rerunning; CI will not install it."
            }
            Write-Host "OK: $path"
          }
          & "$env:JAVA_HOME\bin\java.exe" -version
          if ($LASTEXITCODE -ne 0) { throw 'Java version check failed' }
          & git --version
          if ($LASTEXITCODE -ne 0) { throw 'Git is missing' }
          & gh --version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI is missing' }

      - name: Select release channel
        id: release
        run: |
          $ErrorActionPreference = 'Stop'
          $gradleFile = Get-Content 'app/build.gradle.kts' -Raw
          $versionMatch = [regex]::Match($gradleFile, 'versionName\s*=\s*"([0-9.]+)"')
          if (-not $versionMatch.Success) { throw 'Cannot read versionName from app/build.gradle.kts' }
          $version = $versionMatch.Groups[1].Value
          $publish = 'false'
          $nightly = ''
          $tag = $env:GITHUB_REF_NAME

          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            if ($tag -ne "v$version") { throw "Tag $tag doesn't match version $version" }
            $publish = 'true'
          } elseif ($env:GITHUB_REF.StartsWith('refs/tags/nightly-')) {
            $prefix = "nightly-$version-"
            if (-not $tag.StartsWith($prefix)) { throw "Tag $tag doesn't match version $version" }
            $nightly = $tag.Substring($prefix.Length)
            $publish = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            $nightly = "$env:GITHUB_RUN_NUMBER"
            $tag = "nightly-$version-$nightly"
            $publish = 'true'
            $previous = (& git for-each-ref --sort=-creatordate --count=1 --format='%(refname:short)' 'refs/tags/nightly-*' | Select-Object -First 1)
            if ($previous) {
              $previousSha = (& git rev-parse "$previous^{commit}").Trim()
              if ($previousSha -eq $env:GITHUB_SHA) { $publish = 'false' }
            }
          }

          if ($nightly) {
            $num = 0
            if (-not [int]::TryParse($nightly, [ref]$num) -or $num -lt 1 -or $num -gt 9998) {
              throw 'Nightly build number must be in 1..9998'
            }
          }
          @(
            "publish=$publish",
            "nightly=$nightly",
            "tag=$tag",
            "version=$version"
          ) | Add-Content -Path $env:GITHUB_OUTPUT -Encoding UTF8

      - name: Check release signing key
        if: steps.release.outputs.publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if (-not $env:KEYSTORE_B64) {
            throw 'KEYSTORE_B64 is missing; signed official releases need existing signing secrets'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'chronotif-release.jks'
          [System.IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_B64))
          "CHRONOTIF_KEYSTORE=$keystore" | Add-Content -Path $env:GITHUB_ENV -Encoding UTF8

      - name: Build and test with existing SDK/JDK
        env:
          CHRONOTIF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHRONOTIF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHRONOTIF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NIGHTLY: ${{ steps.release.outputs.nightly }}
        run: |
          $tasks = @('--no-daemon', 'testDebugUnitTest', 'lintDebug', 'assembleDebug', 'assembleRelease')
          if ($env:NIGHTLY) { $tasks += "-PnightlyBuild=$env:NIGHTLY" }
          & .\gradlew.bat @tasks
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed: $LASTEXITCODE" }

      - name: Check nightly variant
        if: steps.release.outputs.nightly == '' && steps.release.outputs.publish != 'true'
        run: |
          & .\gradlew.bat --no-daemon testDebugUnitTest lintDebug assembleRelease '-PnightlyBuild=1'
          if ($LASTEXITCODE -ne 0) { throw "Nightly variant failed: $LASTEXITCODE" }

      # No Actions artifact storage; manual runs publish a downloadable APK to Releases.
      - name: Publish test APK for direct phone installation
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "test-top-swipe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $source = 'app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path -LiteralPath $source)) { throw "APK not generated: $source" }
          $apk = "chronotif-test-$tag.apk"
          Copy-Item -LiteralPath $source -Destination $apk
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $apk" | Set-Content -Path "$apk.sha256" -Encoding ASCII
          & gh release create $tag $apk "$apk.sha256" --target $env:GITHUB_SHA --title "Chronotif Test (top-edge swipe) $env:GITHUB_RUN_NUMBER" --notes 'Experimental test build (app.chronotif.dev), installed beside official Chronotif. Top-edge swipe is OFF by default. Debug signing may change between runner environments.' --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Test release publication failed: $LASTEXITCODE" }

      - name: Publish signed stable or nightly release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NIGHTLY: ${{ steps.release.outputs.nightly }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = "chronotif-$env:TAG.apk"
          Copy-Item 'app\build\outputs\apk\release\app-release.apk' $apk
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $apk" | Set-Content -Path "$apk.sha256" -Encoding ASCII
          $flags = @('--latest')
          $title = $env:TAG
          if ($env:NIGHTLY) {
            $flags = @('--prerelease', '--latest=false')
            $title = "$env:VERSION-nightly.$env:NIGHTLY"
          }
          & gh release create $env:TAG $apk "$apk.sha256" --target $env:GITHUB_SHA --title $title --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $LASTEXITCODE" }
