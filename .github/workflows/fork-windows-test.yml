name: Fork-only Windows Android CI

# Run trusted main commits on the existing self-hosted Windows runner.
# Never build unreviewed PR code on a personal machine.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Trusted fork branch or commit to test (owner only)"
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  build-debug:
    if: >-
      github.repository == 'lgg/chronotif' &&
      (github.event_name == 'push' || github.actor == 'lgg')
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    env:
      ANDROID_HOME: 'D:\Android\Sdk'
      JAVA_HOME: 'C:\Program Files\Eclipse Adoptium\jdk-17.0.20.101-hotspot'
      GRADLE_USER_HOME: 'D:\Android\gradle-chronotif'
    steps:
      - name: Check out trusted fork code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Verify installed Java and Android SDK
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in @(
            "$env:JAVA_HOME\bin\java.exe",
            "$env:ANDROID_HOME\platforms\android-36\android.jar",
            "$env:ANDROID_HOME\build-tools\36.0.0\aapt2.exe",
            ".\gradlew.bat"
          )) {
            if (-not (Test-Path -LiteralPath $p)) { throw "Required build tool missing: $p" }
          }
          & "$env:JAVA_HOME\bin\java.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Java execution failed" }

      - name: Unit tests, lint, debug APK
        run: |
          & .\gradlew.bat --no-daemon testDebugUnitTest lintDebug assembleDebug
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed: $LASTEXITCODE" }
          if (-not (Test-Path 'app\build\outputs\apk\debug\app-debug.apk')) {
            throw 'Debug APK was not produced'
          }

      - name: Save installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chronotif-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
