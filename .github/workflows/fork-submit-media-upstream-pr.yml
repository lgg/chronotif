name: 'Fork-only: submit media dismissal upstream PR'

# One-shot CI from the trusted main branch, never shipped with the upstream PR.
on:
  push:
    branches: [main]
    paths:
      - '.github/ci-trigger/media-upstream-pr.txt'

permissions:
  contents: read

jobs:
  submit:
    if: >-
      github.repository == 'lgg/chronotif' &&
      github.actor == 'lgg' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'ci(fork): submit media dismissal upstream PR'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create upstream PR using existing personal gh login
        run: |
          $ErrorActionPreference = 'Stop'
          $gh = 'C:\Program Files\GitHub CLI\gh.exe'
          if (-not (Test-Path -LiteralPath $gh)) { throw 'GitHub CLI unavailable' }
          # GitHub Actions' repo-scoped token cannot create PRs in nagarete/chronotif.
          # Use the already-authorized personal gh login on the same trusted Windows runner.
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          & $gh auth status *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Personal gh CLI login unavailable' }
          $login = (& $gh api user --jq '.login').Trim()
          if ($LASTEXITCODE -ne 0 -or $login -ne 'lgg') {
            throw 'Expected locally authenticated GitHub user lgg'
          }
          $sha = (& $gh api 'repos/lgg/chronotif/branches/feat/media-dismiss-upstream' --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -ne 'ef7355ae9e2d79218a258c2daed231af0c25c5ba') {
            throw 'Feature branch changed since validation; refusing stale PR'
          }
          $existingJson = & $gh api 'repos/nagarete/chronotif/pulls?state=all&per_page=100'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check upstream PRs' }
          $existing = @($existingJson | ConvertFrom-Json | Where-Object {
            $_.head.repo.full_name -eq 'lgg/chronotif' -and $_.head.ref -eq 'feat/media-dismiss-upstream'
          })
          if ($existing.Count -gt 0) {
            Write-Host ("Upstream PR already exists: {0}" -f $existing[0].html_url)
            exit 0
          }
          $body = @'
          ## What and why
          
          Closes #39.
          
          Allow swipe-to-dismiss of inactive Media players directly in Chronotif, including Apple Music's protected `FLAG_NO_CLEAR` notification on Redmi Note 12S / Android 15 / HyperOS.
          
          - Reuse existing `SwipeDismiss` and `Act.dismiss()` for clearable notifications.
          - For `NO_CLEAR` media, send the app-provided `Notification.deleteIntent` on the user's swipe. Do not try to cancel an ongoing notification through the listener.
          - Block PLAYING, BUFFERING, CONNECTING and other active/transitional states. When a stale media session has no playback state, an unambiguous notification `Play` action (and no `Pause` action) allows an attempt.
          - Re-read the current notification and session before dismissal, so playback resuming during a gesture stays protected.
          - Never hide the player only inside Chronotif. If Android does not actually remove the notification, restore the card.
          - Recognize horizontal swipes over nested media views while preserving taps, vertical scrolling, playback controls and the seek bar.
          
          No new permissions, network use, analytics, dependencies, services, polling, or accessibility changes. Single upstream-based feature commit; no fork-only CI or build configuration.
          
          ## How I tested it
          
          - Device: Redmi Note 12S, Android 15 / HyperOS; Apple Music.
          - ADB inspection of paused Apple Music: `NO_CLEAR`, `FOREGROUND_SERVICE` and app-provided `deleteIntent`.
          - Reported fixed in the installed `Chronotif Test / 9`: paused media card now swipes away successfully in Chronotif on the reporting device.
          - Exact upstream-ready commit `ef7355ae9e2d79218a258c2daed231af0c25c5ba`: unit tests, lint, release and debug builds passed: https://github.com/lgg/chronotif/actions/runs/41714532371
          - Original *before-fix* recording: https://youtube.com/shorts/MJYj8gCevDU . No separate post-fix recording uploaded yet.
          
          ## Checklist
          
          - [x] `./gradlew testDebugUnitTest lintDebug assembleDebug` passed for this contribution commit
          - [x] `docs/notification-behavior.md`, `GLOSSARY.md` updated; `NotificationBehaviorTest` and playback-state coverage added
          - [x] No local-only hiding of protected media cards
          - [x] No new network access, analytics, background services, wakelocks or dependencies
          - [x] Lock-screen privacy handling unchanged
          - [x] Happy to contribute under GPL-3.0-or-later
          
          @nagarete Thanks for your pointers in #39! The user-tested implementation now works on the device where the issue was reported. Please review the `deleteIntent` path and the stale-session fallback; if the behavior aligns with the project, it would be great to merge.
          '@
          $content = ($body -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $path = Join-Path $env:RUNNER_TEMP 'chronotif-media-upstream-pr.md'
          [System.IO.File]::WriteAllText($path, $content, ([System.Text.UTF8Encoding]::new($false)))
          & $gh pr create --repo nagarete/chronotif --base main `
            --head lgg:feat/media-dismiss-upstream `
            --title 'Allow dismissing inactive Media players via app deleteIntent' `
            --body-file $path
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create upstream PR' }
